<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk For Fun — กิจกรรมแนะนำ</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:transparent;
}

.rff,
.rff * {
  box-sizing:border-box;
}

.rff {
  --green:#007947;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  display:grid;
  grid-template-columns:1.1fr 1fr;
  align-items:center;
  gap:8px;
  width:100%;
  min-height:320px;
  padding:32px;
  border:1px solid #dcefe6;
  border-radius:14px;
  background:
    radial-gradient(
      ellipse at 85% 75%,
      #c5e3d6 0%,
      transparent 55%
    ),
    linear-gradient(120deg,#e9f8f1,#f1faf5);
  color:#104c37;
  font-family:'Kanit',sans-serif;
}

.rff__copy {
  position:relative;
  z-index:1;
  min-width:0;
}

.rff__badge {
  display:inline-block;
  padding:5px 13px;
  border-radius:24px;
  background:#b9e8d5;
  font-size:13px;
  font-weight:500;
}

.rff h2 {
  margin:15px 0 6px;
  font-family:'Figtree',sans-serif;
  font-size:clamp(36px,5.6vw,60px);
  line-height:1.06;
  font-weight:800;
  letter-spacing:-1.8px;
}

.rff h3 {
  margin:0 0 10px;
  font-size:clamp(17px,2.4vw,23px);
  line-height:1.5;
  font-weight:500;
}

.rff p {
  margin:0;
  font-size:15px;
  line-height:1.8;
  font-weight:300;
  color:#284d40;
}

.rff__button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  margin-top:22px;
  padding:12px 21px;
  border:0;
  border-radius:7px;
  background:var(--green);
  color:#fff;
  font:500 16px 'Kanit',sans-serif;
  text-decoration:none;
  box-shadow:0 5px 12px #00794716;
  transition:background .18s,transform .18s;
  cursor:pointer;
}

.rff__button:hover {
  background:#005d36;
  transform:translateY(-2px);
}

.rff__button:focus-visible {
  outline:3px solid #124f3a;
  outline-offset:4px;
}

.rff__art {
  display:block;
  width:100%;
  max-width:390px;
  height:auto;
  min-width:0;
  justify-self:center;
  border-radius:12px;
}

@media(max-width:560px) {
  .rff {
    padding:24px;
    grid-template-columns:1fr;
    gap:8px;
  }

  .rff h2 {
    font-size:46px;
  }

  .rff h3 {
    font-size:20px;
  }

  .rff__art {
    max-width:270px;
  }

  .rff__button {
    margin-top:18px;
  }
}

@media(prefers-reduced-motion:reduce) {
  .rff__button {
    transition:none;
  }
}
</style>
</head>

<body>
<section class="rff" aria-labelledby="rff-title">
  <div class="rff__copy">
    <span class="rff__badge">กิจกรรมแนะนำ</span>

    <h2 id="rff-title">Risk For Fun</h2>

    <h3>เรียนรู้ความเสี่ยง ผ่านเกมสนุกใกล้ตัว</h3>

    <p>
      สนุกกับเกม เสริมความรู้ สร้างความตระหนัก<br>
      เพราะการเรียนรู้เรื่องความเสี่ยง เป็นเรื่องสนุกได้!
    </p>

    <a
      class="rff__button"
      href="https://forms.cloud.microsoft/pages/responsepage.aspx?id=w9lFUAs7FUOFlGQRi710lVvz_6ehw8VPuCBd4rzXdipUQ1RLNktJUDhKS0YwUEFaNjZQWFlSTUxVWiQlQCN0PWcu&amp;origin=lprLink&amp;route=shorturl"
      target="_blank"
      rel="noopener noreferrer"
    >
      เข้าร่วมกิจกรรม
      <span aria-hidden="true">→</span>
    </a>
  </div>

  <img
    class="rff__art"
    src="https://haadthipo365.sharepoint.com/sites/RMCGConnect/Picture/%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%9B%E0%B8%81%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1_CG%20IN%20ACTION.png"
    alt="ภาพหน้าปกกิจกรรม CG IN ACTION"
  >
</section>
</body>
</html>
