<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk For Fun — กิจกรรมแนะนำ</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { margin:0; background:transparent; }
.rff, .rff * { box-sizing:border-box; }
.rff { --green:#007947; position:relative; isolation:isolate; overflow:hidden; display:grid; grid-template-columns:1.1fr 1fr; align-items:center; gap:8px; width:100%; min-height:320px; padding:32px; border:1px solid #dcefe6; border-radius:14px; background:radial-gradient(ellipse at 85% 75%,#c5e3d6 0%,transparent 55%),linear-gradient(120deg,#e9f8f1,#f1faf5); color:#104c37; font-family:'Kanit',sans-serif; }
.rff__copy { position:relative; z-index:1; }
.rff__badge { display:inline-block; padding:5px 13px; border-radius:24px; background:#b9e8d5; font-size:13px; font-weight:500; }
.rff h2 { margin:15px 0 6px; font-family:'Figtree',sans-serif; font-size:clamp(36px,5.6vw,60px); line-height:1.06; font-weight:800; letter-spacing:-1.8px; }
.rff h3 { margin:0 0 10px; font-size:clamp(17px,2.4vw,23px); line-height:1.5; font-weight:500; }
.rff p { margin:0; font-size:15px; line-height:1.8; font-weight:300; color:#284d40; }
.rff__button { display:inline-flex; align-items:center; justify-content:center; gap:20px; margin-top:22px; padding:12px 21px; border:0; border-radius:7px; background:var(--green); color:#fff; font:500 16px 'Kanit',sans-serif; text-decoration:none; box-shadow:0 5px 12px #00794716; transition:background .18s,transform .18s; }
.rff__button:hover { background:#005d36; transform:translateY(-2px); }
.rff__button:focus-visible { outline:3px solid #124f3a; outline-offset:4px; }
.rff__button[aria-disabled="true"] { cursor:default; }
.rff__art { width:100%; max-width:390px; justify-self:center; display:block; overflow:visible; }
@media(max-width:560px) { .rff { padding:24px; grid-template-columns:1fr; gap:8px; } .rff h2 { font-size:46px; } .rff h3 { font-size:20px; } .rff__art { max-width:270px; } .rff__button { margin-top:18px; } }
@media(prefers-reduced-motion:reduce) { .rff__button { transition:none; } }
</style>
</head>
<body>
<section class="rff" aria-labelledby="rff-title">
  <div class="rff__copy">
    <span class="rff__badge">กิจกรรมแนะนำ</span>
    <h2 id="rff-title">Risk For Fun</h2>
    <h3>เรียนรู้ความเสี่ยง ผ่านเกมสนุกใกล้ตัว</h3>
    <p>สนุกกับเกม เสริมความรู้ สร้างความตระหนัก<br>เพราะการเรียนรู้เรื่องความเสี่ยง เป็นเรื่องสนุกได้!</p>
    <a class="rff__button" href="-" target="_blank" rel="noopener noreferrer">เข้าร่วมกิจกรรม <span aria-hidden="true">→</span></a>
  </div>
  <!-- ภาพ SVG รวมอยู่ในไฟล์ ไม่ต้องอัปโหลดภาพแยก -->
  <svg class="rff__art" viewBox="0 0 360 330" role="img" aria-label="ตัวต่อ Risk และ Solution พร้อมแว่นขยาย">
    <defs>
      <linearGradient id="rff-green" x2="1" y2="1"><stop stop-color="#31ad7e"/><stop offset="1" stop-color="#006a40"/></linearGradient>
      <linearGradient id="rff-white" x2=".8" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#cbded4"/></linearGradient>
      <linearGradient id="rff-metal" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".45" stop-color="#9aafa5"/><stop offset=".7" stop-color="#eff7f2"/><stop offset="1" stop-color="#7d978a"/></linearGradient>
      <filter id="rff-shadow" x="-50%" y="-50%" width="220%" height="230%"><feDropShadow dx="5" dy="10" stdDeviation="6" flood-color="#315a46" flood-opacity=".23"/></filter>
    </defs>
    <text x="215" y="31" text-anchor="middle" fill="#24513e" font-family="Kanit,sans-serif" font-size="15" transform="rotate(-8 215 31)">เกมเล็ก ๆ</text>
    <text x="224" y="53" text-anchor="middle" fill="#24513e" font-family="Kanit,sans-serif" font-size="14" transform="rotate(-8 224 53)">สร้างการเปลี่ยนแปลงได้จริง</text>
    <ellipse cx="181" cy="292" rx="128" ry="15" fill="#386f4f" opacity=".08"/>
    <g transform="translate(47 72) rotate(13 120 100)" filter="url(#rff-shadow)">
      <path d="M20 16H62V9C62-16 96-16 96 9V16H129V49H121C96 49 96 83 121 83H129V119H93V111C93 87 59 87 59 111V119H20V82H12C-12 82-12 49 12 49H20Z" fill="url(#rff-green)" stroke="#16865d" stroke-width="2"/>
      <text x="72" y="73" text-anchor="middle" font-family="Figtree,sans-serif" font-weight="800" font-size="26" fill="white">RISK</text>
      <path d="M132 17H168V9C168-14 201-14 201 9V17H235V53H242C266 53 266 85 242 85H235V121H199V130C199 154 166 154 166 130V121H132V83H123C100 83 100 50 123 50H132Z" fill="url(#rff-white)" stroke="#dce9e0" stroke-width="2"/>
      <path d="M21 123H60V114C60 91 93 91 93 114V123H130V158H139C162 158 162 191 139 191H130V226H94V234C94 257 61 257 61 234V226H21V191H13C-10 191-10 158 13 158H21Z" fill="url(#rff-white)" stroke="#dce9e0" stroke-width="2"/>
      <text x="74" y="185" text-anchor="middle" font-family="Figtree,sans-serif" font-weight="800" font-size="16" fill="#007947">SOLUTION</text>
    </g>
    <g transform="rotate(-28 244 209)" filter="url(#rff-shadow)">
      <rect x="232" y="221" width="26" height="94" rx="12" fill="url(#rff-green)"/>
      <rect x="232" y="222" width="26" height="20" rx="4" fill="url(#rff-metal)"/>
      <circle cx="245" cy="174" r="56" fill="#e3f3eb" fill-opacity=".68" stroke="url(#rff-metal)" stroke-width="13"/>
      <circle cx="245" cy="174" r="46" fill="none" stroke="#789b88" stroke-width="2"/>
      <path d="M216 170A31 31 0 0 1 244 143" fill="none" stroke="white" stroke-opacity=".9" stroke-width="6" stroke-linecap="round"/>
    </g>
  </svg>
</section>
</body>
</html>
